# Every pull request, and every push to dev or main: the three test layers.
#   app       lint + secret scan + Supabase CLI pin + types + unit/component
#             tests (vitest) + build
#   e2e       the journeys in a real browser, laptop and phone (Playwright)
#   database  the data rules (pgTAP) — the only place RLS is proven — then the
#             repository contract against the same stack (integration)
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:secrets
      # Every supabase/setup-cli step installs the CLI version locked in
      # package-lock.json. A moving "latest" broke the nightly backup on 17 Nov
      # 2026; bump the devDependency and the workflows together.
      - name: Supabase CLI pinned to package-lock.json
        run: |
          want=$(node -p "require('./package-lock.json').packages['node_modules/supabase'].version")
          bad=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            awk -v want="$want" -v f="$f" '
              function check() {
                if (at && !ok) { printf "::error file=%s,line=%d::supabase/setup-cli is not pinned to %s, the version in package-lock.json\n", f, at, want; bad = 1 }
                at = 0
              }
              /uses:[ \t]*supabase\/setup-cli@/ { check(); at = FNR; ok = 0; next }
              at && $1 == "version:" { v = $2; gsub(/"/, "", v); gsub(sprintf("%c", 39), "", v); ok = (v == want); check(); next }
              at && /^[ \t]*-[ \t]/ { check() }
              END { check(); exit bad }
            ' "$f" || bad=1
          done
          exit $bad
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Runs against the in-memory demo class: no project, no secrets.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same version as package-lock.json (checked in the app job).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      # Postgres + auth only: the tests insert into auth.users and read auth.uid().
      # Applying migrations/ and seed.sql is part of the start.
      - run: supabase start -x studio,imgproxy,inbucket,realtime,storage-api,edge-runtime,logflare,vector,supavisor,mailpit
      # Runs supabase/tests/*.sql with pgTAP — must stay 100% green.
      - run: supabase test db
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The repository contract against the same local stack. pgTAP rolled back
      # its changes, so the seeded class is intact.
      - run: npx vitest run -c vitest.integration.config.ts
      - if: failure()
        run: supabase status || true
