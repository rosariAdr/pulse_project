# Every pull request, and every push to dev or main: the three test layers.
#   app       lint + types + unit/component tests (vitest) + build
#   e2e       the journeys in a real browser, laptop and phone (Playwright)
#   database  the data rules (pgTAP) — the only place RLS is proven
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Runs against the in-memory demo class: no project, no secrets.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Postgres + auth only: the tests insert into auth.users and read auth.uid().
      # Applying migrations/ and seed.sql is part of the start.
      - run: supabase start -x studio,imgproxy,inbucket,realtime,storage-api,edge-runtime,logflare,vector,supavisor,mailpit
      # Runs supabase/tests/*.sql with pgTAP — must stay 100% green.
      - run: supabase test db
      - if: failure()
        run: supabase status || true
