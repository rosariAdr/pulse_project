# Supabase free plan: projects are paused after 1 week of inactivity.
# A daily call to public.ping() (reads no data) keeps dev and prod awake.
# Still wake the project yourself (open the app) the day before a class.
# Note: GitHub disables scheduled workflows in a repo with no commits for 60 days.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *"   # every day, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [DEV, PROD]
    steps:
      - name: Ping ${{ matrix.env }}
        env:
          URL: ${{ secrets[format('SUPABASE_URL_{0}', matrix.env)] }}
          KEY: ${{ secrets[format('SUPABASE_ANON_KEY_{0}', matrix.env)] }}
        run: |
          if [ -z "$URL" ]; then echo "No secret for ${{ matrix.env }} — skipping"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
